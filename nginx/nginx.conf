worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=5r/s;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
    
    # Body size limit for uploads
    client_max_body_size 10M;
    
    # Timeouts
    keepalive_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    upstream backend_cluster {
        # 'backend' is the service name in docker-compose.yml.
        # Docker's internal DNS will resolve this to the 3 instances.
        server backend:8080;
        
        # Enable keepalive connections to upstream to reduce TCP handshake overhead
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Specific rate limit for booking endpoint
        location /api/v1/tickets/offline {

            limit_req zone=booking_limit burst=5 nodelay;
            proxy_pass http://backend_cluster;
            # Configure proxy for keepalive to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {

            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://backend_cluster;
            # Configure proxy for keepalive to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
